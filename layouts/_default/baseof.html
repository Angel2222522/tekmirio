<!doctype html>
<html lang="{{ if eq .Params.lang "en" }}en{{ else }}el{{ end }}">
<head>{{ partial "head.html" . }}</head>
<body class="{{ .Kind }}{{ with .Section }} s-{{ . }}{{ end }}">
<a class="skip" href="#main">{{ if eq .Params.lang "en" }}Skip to content{{ else }}Μετάβαση στο περιεχόμενο{{ end }}</a>
{{ partial "header.html" . }}
<main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}
<script>{{ partial "site.js" . | safeJS }}</script>
</body>
</html>
